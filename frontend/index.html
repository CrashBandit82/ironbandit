    <!-- Structured data for rich results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "IronBandit",
      "url": "https://ironbandit.at/",
      "description": "Kostenloses digitales Trainingstagebuch für Kraft- und Fitnesstraining. Übungen und Trainingspläne anlegen, jeden Satz mit Gewicht und Wiederholungen tracken und den Fortschritt verfolgen.",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web, Android, iOS",
      "inLanguage": "de",
      "image": "https://ironbandit.at/og-image.png",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      },
      "author": {
        "@type": "Person",
        "name": "Gerald Perchtaler"
      }
    }
    </script>
    <!-- Set the theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ironbandit_theme");
          if (t !== "light" && t !== "dark") {
            t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
