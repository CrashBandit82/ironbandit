user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Version nicht ausplaudern: ohne das steht "nginx/1.31.3" in jedem
    # Response-Header und auf jeder Fehlerseite und erleichtert gezieltes Scannen.
    server_tokens off;

    # Echte Client-IP: Nur dem NPM-Proxy (192.168.0.24) wird X-Forwarded-For
    # geglaubt — dessen selbst angehängter (= letzter) Eintrag wird $remote_addr.
    # Direktzugriffe aus dem LAN können so KEINE fremden IPs vortäuschen
    # (sonst könnte jemand per gefälschtem Header Unbeteiligte — oder den NPM
    # selbst — in den fail2ban-Bann treiben).
    set_real_ip_from 192.168.0.24;
    real_ip_header X-Forwarded-For;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    # Zweitausgabe als echte Datei (Host-Mount) — Futter für fail2ban
    access_log /var/log/nginx-host/access.log main;

    # Generische Rate-Bremse VOR der Anwendung. Der slowapi-Limiter im Backend
    # greift erst nach dem Proxy-Durchlauf und schützt nur /api/-Endpunkte —
    # Landingpage, Assets und Scanner-Fluten liefen bisher ungebremst durch.
    # Schlüssel ist $binary_remote_addr, was dank real_ip die ECHTE Client-IP
    # ist (nicht die des NPM). Grenzen bewusst großzügig: ein Seitenaufruf lädt
    # mehrere Assets parallel, das darf nie ausbremsen.
    limit_req_zone $binary_remote_addr zone=ib_static:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ib_api:10m    rate=10r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=ib_conn:10m;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json image/svg+xml;

    # Hinweis: nginx vererbt add_header NICHT in Locations, die selbst add_header
    # setzen — daher sind die Security-Header dort jeweils wiederholt.
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Von fail2ban gepflegte Bann-Liste (deny <client-ip>;) — greift dank
        # real_ip auf die ECHTE Client-IP, nicht auf die NPM-Adresse.
        include /etc/nginx/fail2ban/banned.conf;

        # Security headers (TLS/HSTS übernimmt der externe Reverse-Proxy)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # CSP: Scripts strikt 'self' (kein Inline-JS in der Build-Ausgabe) — das ist
        # der wichtige Riegel gegen XSS. 'unsafe-inline' nur für style nötig
        # (Tailwind-Inline-Styles). connect-src 'self': API liegt same-origin.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-UTvxVXbQJNh38WNILPYig971dEnG/fQ0YernfPzWjdU='; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        # PWA manifest — short cache so icon/theme updates propagate quickly
        location /manifest.json {
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        # Service Worker & Versionsdatei: NIE cachen.
        # Exakte `location =`-Matches gewinnen gegen die Endungs-Regex unten —
        # sonst bekäme /sw.js "immutable, max-age=1y" und der Browser würde ein
        # neues Deploy erst nach einem Jahr bemerken (→ keine Update-Meldung).
        location = /sw.js {
            add_header Cache-Control "no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        location = /version.json {
            add_header Cache-Control "no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        # Static assets (with long cache)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        # Avatar-/Upload-Dateien vom Backend ausliefern. `^~` sorgt dafür, dass
        # dieser Prefix VOR der weiter unten stehenden Datei-Endungs-Regex greift
        # (die sonst z.B. /uploads/avatars/x.jpg fälschlich lokal im Frontend-
        # Root suchen würde statt zum Backend durchzureichen).
        location ^~ /uploads/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "public, max-age=86400";
            # Nutzer-hochgeladene Dateien: eigene add_header-Location → server-Header
            # werden NICHT vererbt, hier also explizit setzen. sandbox + nosniff
            # machen den Inhalt inert, selbst falls je etwas anderes als das vom
            # Backend erzwungene JPEG durchrutschen würde.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        }

        # API proxy to backend
        location /api/ {
            # burst=20 nodelay: kurze Bündel (Dashboard lädt beim Start mehrere
            # Endpunkte parallel) gehen sofort durch, Dauerfeuer wird gedrosselt.
            limit_req zone=ib_api burst=20 nodelay;
            limit_conn ib_conn 20;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }

        # SPA: route all other requests to index.html
        location / {
            limit_req zone=ib_static burst=60 nodelay;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=0, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            # CSP hier wiederholen: diese Location liefert index.html aus (das
            # Dokument, auf das die CSP wirkt), und nginx vererbt add_header nicht,
            # wenn die Location eigene add_header setzt.
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-UTvxVXbQJNh38WNILPYig971dEnG/fQ0YernfPzWjdU='; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        }

        # Deny access to sensitive files
        location ~ /\.git {
            deny all;
        }

        location ~ /\.env {
            deny all;
        }
    }
}
